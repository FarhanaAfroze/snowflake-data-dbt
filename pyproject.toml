[project]
name = "snowflake-data-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-snowflake>=1.12.5",
    "faker>=40.54.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "snowflake-connector-python==5.2.0",
]

[dependency-groups]
dev = [
    "dbt-snowflake>=1.12.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
